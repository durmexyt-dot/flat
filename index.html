  <!-- Security: scripts only from this site and Google/Firebase, no inline
       scripts, data only to Firebase. GitHub Pages can't send headers, so the
       policy is a meta tag (frame-ancestors needs a header: see
       firebase.json; the frame guard below covers clickjacking meanwhile).
       The sha256 hashes allow exactly the inline scripts FlutterFire injects
       to load the Firebase SDK, one per service. After adding or upgrading
       firebase_* packages, run tool/csp_hashes.py <firebase-js-version> and
       put its output here and in firebase.json; a missing hash stops the
       app on the splash screen. -->

  <!-- Never shown inside another site's frame (clickjacking). -->

  <!-- Match the theme the app will use, so the splash doesn't flash. -->
  <script src="splash_theme.js"></script>
  <style>
    :root, [data-theme="light"] {
      --surface: #ffffff; --on-surface: #0a0a0a; --primary: #5d2bff;
      --on-primary: #ffffff;
    }
    [data-theme="dark"] {
      --surface: #0a0a0a; --on-surface: #fafafa; --primary: #c9bfff;
      --on-primary: #2f009c;
    }
    html, body { margin: 0; height: 100%; background: var(--surface); }
    /* Same layout as the Flutter splash; Flutter draws over it and removes it. */
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: Inter, system-ui, -apple-system, sans-serif;
    }
    #splash .mark {
      width: 96px; height: 96px; border-radius: 26.88px;
      background: var(--primary);
      display: flex; align-items: center; justify-content: center;
    }
    #splash .mark svg { width: 53.76px; height: 53.76px; fill: var(--on-primary); }
    #splash .wordmark {
      margin-top: 20px; height: 48px; font-size: 48px; line-height: 1;
      font-weight: 800; letter-spacing: -0.96px; color: var(--on-surface);
    }
    #splash .wordmark span { color: var(--primary); }
    #splash .tagline { height: 38px; }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">

    </div>
    <div class="wordmark">Stub<span>swap</span></div>
    <div class="tagline"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
